server {
    listen 80;
    client_max_body_size 6m;
    # The original frontend usually prefixes backend requests with /api.
    location /api/ {
        proxy_pass http://api:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
    }
}
