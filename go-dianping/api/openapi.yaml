{
  "openapi": "3.0.3",
  "info": {
    "title": "Go 黑马点评 API",
    "version": "1.0.0",
    "description": "保留Java业务Result格式。教学写接口需登录但没有商家RBAC；公开部署前应补角色权限。金额为分；ID为int64，秒杀响应X-Order-ID为精确字符串。"
  },
  "servers": [
    {
      "url": "http://localhost:8081"
    },
    {
      "url": "http://localhost:8080/api"
    }
  ],
  "paths": {
    "/user/code": {
      "post": {
        "summary": "发送验证码",
        "operationId": "post__user_code",
        "tags": [
          "user"
        ],
        "security": [],
        "description": "开发短信写API日志，不在响应中泄露。关闭dev_code_log时明确返回503，需接短信商。\nRedis: String login:code:手机号 2m；login:throttle:手机号 60s\nMySQL: 无",
        "parameters": [
          {
            "name": "phone",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "11位中国大陆手机号",
            "example": "13900000001"
          }
        ],
        "responses": {
          "200": {
            "description": "业务结果；检查success字段",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "type": "object",
                      "required": [
                        "success"
                      ],
                      "properties": {
                        "success": {
                          "type": "boolean",
                          "enum": [
                            true
                          ]
                        }
                      }
                    },
                    {
                      "$ref": "#/components/schemas/Error"
                    }
                  ]
                },
                "examples": {
                  "success": {
                    "value": {
                      "success": true
                    }
                  },
                  "failure": {
                    "value": {
                      "success": false,
                      "errorMsg": "验证码发送频繁，请稍后重试"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "缺少或失效Token",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "系统故障",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "依赖或短信服务不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/user/login": {
      "post": {
        "summary": "验证码/密码登录",
        "operationId": "post__user_login",
        "tags": [
          "user"
        ],
        "security": [],
        "description": "裸Token返回data；password分支只验证bcrypt，不接受原未启用的MD5工具。\nRedis: 消费验证码；限制5次尝试；写login:token:Token Hash，TTL30m\nMySQL: 按唯一手机号查询；首次验证码登录创建tb_user",
        "parameters": [],
        "responses": {
          "200": {
            "description": "业务结果；检查success字段",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "type": "object",
                      "required": [
                        "success"
                      ],
                      "properties": {
                        "success": {
                          "type": "boolean",
                          "enum": [
                            true
                          ]
                        },
                        "data": {
                          "type": "string"
                        }
                      }
                    },
                    {
                      "$ref": "#/components/schemas/Error"
                    }
                  ]
                },
                "examples": {
                  "success": {
                    "value": {
                      "success": true,
                      "data": "64位随机十六进制Token"
                    }
                  },
                  "failure": {
                    "value": {
                      "success": false,
                      "errorMsg": "验证码无效或尝试次数过多"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "缺少或失效Token",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "系统故障",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "依赖或短信服务不可用",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginInput"
              },
              "example": {
                "phone": "13900000001",
                "code": "从日志或Redis读取"
              }
            }
          }
        }
      }
    },
