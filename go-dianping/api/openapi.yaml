        "description": "金额>0，秒杀额外必填stock>0、beginTime、endTime。接受带时区RFC3339或无时区2006-01-02T15:04:05（按配置时区）。"
      },
      "ScrollResult": {
        "type": "object",
        "properties": {
          "list": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Blog"
            }
          },
          "minTime": {
            "type": "integer",
            "format": "int64",
            "description": "下一页lastId，最小毫秒时间戳"
          },
          "offset": {
            "type": "integer",
            "description": "此minTime已消费条数，原样带到下一页"
          }
        }
      },
      "OrderStatus": {
        "type": "object",
        "properties": {
