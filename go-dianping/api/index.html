<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go 黑马点评 API</title>
<style>body{font:16px/1.65 system-ui,sans-serif;max-width:1080px;margin:48px auto;padding:0 24px;background:#f7f8fa;color:#182330}h1{font-size:32px}input{font:inherit;padding:10px;width:90%;border:1px solid #bac5d0;border-radius:6px}details{background:white;border:1px solid #dde3eb;border-radius:8px;margin:12px 0;padding:16px}summary{cursor:pointer;font-weight:600}code,pre{font-family:ui-monospace,monospace}pre{overflow:auto;white-space:pre-wrap;background:#f0f3f6;padding:16px}a{color:#1464a5}.method{color:#14765b;display:inline-block;min-width:74px}</style>
<h1>Go 黑马点评 · 接口目录</h1><p>保留 Java Result 格式。登录请求头：<code>authorization: TOKEN</code>。<a href="api/openapi.yaml">下载 OpenAPI</a>；完整示例与字段解释见项目 docs/API.md。</p><input id="search" placeholder="搜索接口名称或路径" aria-label="搜索接口"><main id="routes">正在加载规范…</main>
<script>fetch('api/openapi.yaml').then(r=>r.json()).then(spec=>{const root=document.querySelector('#routes');root.textContent='';for(const [path,methods] of Object.entries(spec.paths)){for(const [method,op] of Object.entries(methods)){const detail=document.createElement('details'),summary=document.createElement('summary'),label=document.createElement('span'),title=document.createElement('span'),pre=document.createElement('pre');label.className='method';label.textContent=method.toUpperCase();title.textContent=path+' — '+op.summary;summary.append(label,title);detail.append(summary);pre.textContent=JSON.stringify(op,null,2);detail.append(pre);root.append(detail)}}document.querySelector('#search').oninput=e=>{for(const d of root.children)d.hidden=!d.firstChild.textContent.toLowerCase().includes(e.target.value.toLowerCase())}}).catch(e=>document.querySelector('#routes').textContent='规范读取失败：'+e.message)</script></html>
